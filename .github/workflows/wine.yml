name: Wine and Xvfb Runner

on:
  push:
    branches:
      - main
      - master
      - 'arena/**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  test-wine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Make setup script executable
        run: chmod +x setup_wine.sh

      - name: Run Wine & Xvfb setup
        run: ./setup_wine.sh

      - name: Verify Wine environment
        run: |
          xvfb-run --auto-servernum wineboot --init
          xvfb-run --auto-servernum wine cmd.exe /c echo "Wine is working properly under Xvfb!"
